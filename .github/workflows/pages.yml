name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = f"https://api.github.com/repos/{os.environ['GH_REPO']}/actions/runs/{os.environ['RUN_ID']}/artifacts?per_page=100"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Cache-Control": "no-cache",
          })
          expected_id = int(os.environ["ARTIFACT_ID"])
          expected_name = os.environ["ARTIFACT_NAME"]
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      artifacts = json.load(response)["artifacts"]
                  matches = [item for item in artifacts if item["name"] == expected_name and not item["expired"]]
                  if len(matches) == 1 and matches[0]["id"] == expected_id:
                      print(f"Pages artifact {expected_id} is visible to the deployment API.")
                      break
              except urllib.error.HTTPError as error:
                  if error.code not in (429, 500, 502, 503, 504):
                      raise
              if attempt < 11:
                  time.sleep(5)
          else:
              raise RuntimeError("Pages artifact metadata did not become available within the bounded wait.")
          PY

      - name: Deploy
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) throw new Error('Invalid Pages artifact ID.');
            const {data: deployment} = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifactId, pages_build_version: context.sha,
              oidc_token: await core.getIDToken()
            });
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('Pages did not confirm the deployment ID.');
            core.setOutput('page_url', deployment.page_url);
            const terminalErrors = new Set(['deployment_failed','deployment_perms_error','deployment_content_failed',
              'deployment_cancelled','deployment_lost']);
            for (let attempt = 0; attempt < 60; attempt++) {
              const {data} = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                owner, repo, deploymentId
              });
              if (data.status === 'succeed') {
                core.info('GitHub Pages deployment succeeded.');
                return;
              }
              if (terminalErrors.has(data.status)) throw new Error('Pages: ' + data.status);
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', {
              owner, repo, deploymentId
            });
            throw new Error('GitHub Pages deployment exceeded the ten-minute limit.');
